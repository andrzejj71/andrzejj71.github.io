name: Aktualizacja statystyk NBA

on:
  workflow_dispatch:
  schedule:
    # Codziennie po porannym odświeżeniu danych NBA/DunkAPI (UTC).
    - cron: "17 12 * * *"

permissions:
  contents: write

concurrency:
  group: nba-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Skonfiguruj Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Zainstaluj biblioteki
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Zaktualizuj dane NBA
        env:
          DUNKAPI_API_KEY: ${{ secrets.DUNKAPI_API_KEY }}
        run: python nba.py

      - name: Zapisz nowe dane i zdjęcia w repozytorium
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nba_data.json img/
          if git diff --cached --quiet; then
            echo "Brak zmian do zapisania."
          else
            git commit -m "Automatyczna aktualizacja danych NBA"
            git push
          fi
